<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STR Marker Table</title>
<style>
body { font-family: sans-serif; margin: 20px; }
table { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
th, td { border: 1px solid #ddd; text-align: center; }
td { padding: 4px; width: 20px; min-width: 20px; }
th.marker { background-color: #d9e2f3; position: sticky; top: 0; box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1); height: 100px; padding: 4px; vertical-align: bottom; }
th.marker span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; }
td.kitid { text-align: left; padding: 4px 8px; font-weight: bold; background-color: #fafafa; position: sticky; left: 0; box-shadow: 2px 0 2px -1px rgba(0,0,0,0.1); }
th.kitid { background-color: #d9e2f3; position: sticky; left: 0; top: 0; z-index: 2; padding: 4px 8px; }
</style>
</head>
<body>
<h2>Group 0 - STR Marker Values</h2>
<table>
<thead>
<tr><th class="kitid">Kit ID</th></tr>
</thead>
<tbody>
<tr><td class="kitid" style="background-color: #e8e8e8; border-top: 2px solid #333;">MODAL</td></tr>
</tbody>
</table>
</body>
</html>
