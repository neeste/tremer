<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neely Project - Phylogenetic Tree</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 650px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; }
        h1 { color: #333; margin-top: 0; text-align: center; }
        
        .upload-section { margin: 20px 0; padding: 20px; border: 2px dashed #ccc; text-align: center; background-color: #fafafa; border-radius: 8px;}
        .upload-section h2 { margin-top: 0; color: #0066cc; }
        
        .options-section { text-align: left; margin: 20px auto; max-width: 400px; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        .input-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .generate-btn { width: 100%; background-color: #28a745; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .generate-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <div class="upload-section">
        <h2>Neely Project</h2>
        <p>Enter your group number to view a phylogenetic tree.</p>
    </div>
    
    <div class="options-section">
        <div class="input-group">
            <label for="group-num">Group Number:</label>
            <input type="number" id="group-num" placeholder="e.g., 12" min="1">
        </div>
        
        <div class="input-group">
            <label for="kit-id">Kit ID (optional):</label>
            <input type="text" id="kit-id" placeholder="e.g., MK48102">
        </div>

        <button class="generate-btn" onclick="handleViewClick()">View</button>
    </div>
</div>

<script>
    var Module = {
        locateFile: function(path) {
            if (path.endsWith('.wasm')) {
                return '../wasm/' + path + '?v=3';
            }
            return path;
        }
    };
</script>
<script src="../wasm/tremer.js?v=3"></script>

<script>
    async function handleViewClick() {
        const groupNum = document.getElementById('group-num').value.trim();
        const kitId = document.getElementById('kit-id').value.trim();

        if (!groupNum) {
            alert("Please enter a valid Group Number.");
            return;
        }

        // FIXED: The SVG is now in the same directory as this HTML file
        if (!kitId) {
            window.location.href = `Neely_s${groupNum}.svg`;
            return;
        }

        // FIXED: The input text file is also in the same directory
        const inputFileName = `Neely_s${groupNum}.txt`;
        const inputFilePath = inputFileName; 

        try {
            // Fetch the file silently from the local server folder
            const response = await fetch(inputFilePath);
            if (!response.ok) {
                throw new Error(`Could not locate data for Group ${groupNum}. Please check the group number and try again.`);
            }
            const fileData = await response.arrayBuffer();

            // Write the fetched file into Emscripten's virtual file system
            FS.writeFile(inputFileName, new Uint8Array(fileData));

            // Set up command line arguments for TREMER: "-n KitID filename.txt"
            let args = ["-n", kitId, inputFileName];

            // Run TREMER!
            Module.callMain(args);

            // Target the newly generated HTML file
            const targetOutputFile = `Neely_b${groupNum}.html`;

            // Read the generated file out of the virtual file system
            const generatedData = FS.readFile(targetOutputFile);
            
            // Convert to a File object to preserve the filename for "Save As"
            const file = new File([generatedData], targetOutputFile, { type: "text/html" });
            const url = URL.createObjectURL(file);

            // Navigate the current window to the custom table
            window.location.href = url;

        } catch (error) {
            console.error(error);
            alert("An error occurred: " + error.message);
        }
    }
</script>

</body>
</html>
