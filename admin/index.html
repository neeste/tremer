    function normalizeMarker(raw) {
        let norm = raw.toLowerCase();
        if (norm.startsWith('dys')) norm = norm.substring(3);
        if (norm.startsWith('dyf')) norm = norm.substring(3);
        return norm;
    }

    const normFallback = str_lab.map(normalizeMarker);

    // CSV parser to correctly handle quoted strings
    function parseCSVLine(text) {
        const ret = [];
        let inQuote = false;
        let val = '';
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char === '"' && text[i+1] === '"') {
                val += '"'; i++;
            } else if (char === '"') {
                inQuote = !inQuote;
            } else if (char === ',' && !inQuote) {
                ret.push(val); val = '';
            } else {
                val += char;
            }
        }
        ret.push(val);
        return ret;
    }

    async function processFile() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) {
            alert('Please select a file first.');
            return;
        }

        document.getElementById('report-container').style.display = 'none';
        document.getElementById('report-container').innerHTML = '';
        const downloadsDiv = document.getElementById('downloads');
        downloadsDiv.innerHTML = 'Generating...';
        document.getElementById('output-section').style.display = 'block';

        let files = fileInput.files;
        let isCsvMode = false;
        for (let i=0; i<files.length; i++) {
            if (files[i].name.toLowerCase().endsWith('.csv')) {
                isCsvMode = true; break;
            }
        }

        const fsObj = (typeof FS !== 'undefined') ? FS : (Module.FS ? Module.FS : null);
        if (!fsObj) {
            downloadsDiv.innerHTML = '<p style="color:red;">Error: Filesystem module not loaded.</p>';
            return;
        }

        try {
            const existingFiles = fsObj.readdir('.');
            existingFiles.forEach(f => {
                if (f.endsWith('.json') && f.includes('_report_')) {
                    fsObj.unlink(f);
                }
            });
        } catch (err) {
            console.warn("Could not clean up old report files:", err);
        }

        let targetFileName = files[0].name;

        if (isCsvMode) {
            // Force relaxed mode since we have no SNPs
            document.getElementById('relaxedMode').checked = true;
            
            let outputText = "/GROUPS\nAuto_CSV_Project\n\n/MARKERS\n" + str_lab.join(" ") + "\n\n/STRDATA\n";
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (!file.name.toLowerCase().endsWith('.csv')) continue;
                
                const text = await file.text();
                let kitName = file.name;
                if (kitName.includes('_YDNA_')) kitName = kitName.split('_YDNA_')[0];
                else kitName = kitName.split('.')[0]; 
                
                const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
                if (lines.length < 2) continue; 
                
                const headerLine = parseCSVLine(lines[0]);
                const dataLine = parseCSVLine(lines[1]);
                
                let colMapping = [];
                for (let j = 0; j < headerLine.length; j++) {
                    let header = headerLine[j].trim().toLowerCase();
                    let normTok = normalizeMarker(header);
                    
                    if (normTok.includes('kit') || normTok.includes('name') || normTok.includes('haplogroup') || normTok.includes('snp')) {
                        colMapping.push(-1);
                    } else {
                        let mapped = -1;
                        for (let k = 0; k < str_lab.length; k++) {
                            if (header === str_lab[k].toLowerCase()) { mapped = k; break; }
                        }
                        if (mapped === -1) {
                            const searchA = normTok + 'a';
                            for (let k = 0; k < str_lab.length; k++) {
                                if (normTok === normFallback[k] || searchA === normFallback[k]) { mapped = k; break; }
                            }
                        }
                        if (mapped === -1 && normTok.includes("gata-h4")) mapped = normFallback.indexOf("gatah4");
                        if (mapped === -1 && normTok.includes("gata-a10")) mapped = normFallback.indexOf("yga10");
                        if (mapped === -1 && normTok.includes("ggaat-1b07")) mapped = normFallback.indexOf("y1b07");
                        if (mapped === -1 && normTok.includes("ycaii")) mapped = normFallback.indexOf("ycaiia");
                        if (mapped === -1 && normTok === "389ii") mapped = normFallback.indexOf("389ii-i");
                        colMapping.push(mapped);
                    }
                }
                
                let kitData = new Array(838).fill(0);
                let maxMappedIdx = -1;
                for (let j = 0; j < dataLine.length && j < colMapping.length; j++) {
                    let mapped = colMapping[j];
                    if (mapped !== -1) {
                        let val = dataLine[j].trim();
                        if (val === "" || val === "-") {
                        } else if (val.includes("-")) {
                            let multiIdx = mapped;
                            const subValues = val.split("-");
                            for (let k = 0; k < subValues.length && multiIdx < 838; k++) {
                                const match = subValues[k].trim().match(/\d+/);
                                if (match) { kitData[multiIdx] = parseInt(match[0], 10); if (multiIdx > maxMappedIdx) maxMappedIdx = multiIdx; }
                                multiIdx++;
                            }
                        } else {
                            const match = val.match(/\d+/);
                            if (match) { kitData[mapped] = parseInt(match[0], 10); if (mapped > maxMappedIdx) maxMappedIdx = mapped; }
                        }
                    }
                }
                
                let strValues = [];
                for(let j = 0; j <= maxMappedIdx; j++) {
                    if(kitData[j] > 0) strValues.push(kitData[j]);
                    else strValues.push("N");
                }
                outputText += kitName + " " + strValues.join(' ') + "\n";
            }
            
            targetFileName = "Project_CSV.txt";
            fsObj.writeFile(targetFileName, new TextEncoder().encode(outputText));
            runEngine(targetFileName, fsObj);
            
        } else {
            // Normal TXT workflow
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                fsObj.writeFile(targetFileName, data);
                runEngine(targetFileName, fsObj);
            };
            reader.readAsArrayBuffer(files[0]);
        }
    }

    function runEngine(fileName, fsObj) {
        const downloadsDiv = document.getElementById('downloads');
        let args = [];
        const targetFilter = document.getElementById('targetFilter').value.trim();
        if (targetFilter) args.push('-n', targetFilter);
        
        const projOverride = document.getElementById('projOverride').value.trim();
        if (projOverride) args.push('-p', projOverride);

        const groupOverride = document.getElementById('groupOverride').value.trim();
        if (groupOverride) args.push('-g', groupOverride);
        
        if (document.getElementById('relaxedMode').checked) args.push('-relaxed');

        args.push(fileName);

        setTimeout(function() {
            try {
                Module.callMain(args);
                
                // Check for Syntax JSON Report
                const reportContainer = document.getElementById('report-container');
                try {
                    const dir = fsObj.readdir('.');
                    const jsonFileName = dir.find(f => f.endsWith('.json') && f.includes('_report_'));
                    if (jsonFileName) {
                        const jsonStr = fsObj.readFile(jsonFileName, { encoding: 'utf8' });
                        const report = JSON.parse(jsonStr);
                        if (report.status === "error" || report.status === "warning") {
                            reportContainer.style.display = 'block';
                            reportContainer.style.backgroundColor = report.status === "error" ? "#ffe6e6" : "#fff3cd";
                            reportContainer.style.border = `1px solid ${report.status === "error" ? "#ffcccc" : "#ffeeba"}`;
                            reportContainer.style.color = report.status === "error" ? "#cc0000" : "#856404";
                            let html = `<h3>⚠️ Syntax & Integrity ${report.status === "error" ? "Errors" : "Warnings"}</h3><ul>`;
                            if (report.errors) report.errors.forEach(err => html += `<li><strong>Error:</strong> ${err}</li>`);
                            if (report.warnings) report.warnings.forEach(warn => html += `<li><strong>Warning:</strong> ${warn}</li>`);
                            html += `</ul>`;
                            reportContainer.innerHTML = html;
                        }
                    }
                } catch (err) {}

                // Generate Output File Links
                downloadsDiv.innerHTML = ''; 
                const baseName = fileName.substring(0, fileName.lastIndexOf('.'));
                let projectName = "Project"; let groupNum = 0;
                
                if (projOverride) projectName = projOverride;
                else {
                    const parts = baseName.split(/[-_.]/);
                    if (parts.length >= 2) {
                        projectName = parts[0];
                        const match = parts[1].match(/\d+/);
                        if (match) groupNum = parseInt(match[0], 10);
                    }
                }
                if (groupOverride) groupNum = parseInt(groupOverride, 10);

                let outFiles = [];
                if (targetFilter) outFiles = [`${projectName}_b${groupNum}.html`];
                else outFiles = [`tree${groupNum}.txt`, `${projectName}_s${groupNum}.svg`, `${projectName}_s${groupNum}.html`, `${projectName}_b${groupNum}.html`, `${projectName}_g${groupNum}.html`];

                outFiles.forEach(outFileName => {
                    try {
                        const outData = fsObj.readFile(outFileName);
                        const blob = new Blob([outData], { type: outFileName.endsWith('.svg') ? 'image/svg+xml' : (outFileName.endsWith('.html') ? 'text/html' : 'text/plain') });
                        const url = URL.createObjectURL(blob);

                        const fileRow = document.createElement('div');
                        fileRow.className = 'file-item';
                        const nameLabel = document.createElement('span'); nameLabel.className = 'file-name'; nameLabel.textContent = outFileName;
                        const btnGroup = document.createElement('div'); btnGroup.className = 'btn-group';
                        const viewBtn = document.createElement('button'); viewBtn.className = 'action-btn view-link'; viewBtn.textContent = '👁️ View'; viewBtn.onclick = function() { openViewer(url); };
                        const downloadBtn = document.createElement('a'); downloadBtn.href = url; downloadBtn.download = outFileName; downloadBtn.className = 'action-btn download-link'; downloadBtn.textContent = '⬇️ Download';

                        btnGroup.appendChild(viewBtn); btnGroup.appendChild(downloadBtn);
                        fileRow.appendChild(nameLabel); fileRow.appendChild(btnGroup);
                        downloadsDiv.appendChild(fileRow);
                    } catch (err) {}
                });
                if (downloadsDiv.innerHTML === '') downloadsDiv.innerHTML = '<p style="color:red;">Error: No output files were generated. See console for details.</p>';
            } catch (err) {
                downloadsDiv.innerHTML = `<p style="color:red;"><strong>Engine Crash:</strong> ${err.message}</p>`;
            }
        }, 50);
    }

    function openViewer(url) {
        document.getElementById('viewer-container').style.display = 'flex';
        document.getElementById('file-viewer').src = url;
        document.body.style.overflow = 'hidden'; 
    }

    function closeViewer() {
        document.getElementById('viewer-container').style.display = 'none';
        document.getElementById('file-viewer').src = '';
        document.body.style.overflow = 'auto'; 
    }
</script>

</body>
</html>
