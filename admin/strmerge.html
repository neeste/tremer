    function normalizeMarker(raw) {
        let norm = raw.toLowerCase();
        if (norm.startsWith('dys')) norm = norm.substring(3);
        if (norm.startsWith('dyf')) norm = norm.substring(3);
        return norm;
    }

    const normFallback = str_lab.map(normalizeMarker);

    // CSV parser to correctly handle quoted strings
    function parseCSVLine(text) {
        const ret = [];
        let inQuote = false;
        let val = '';
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char === '"' && text[i+1] === '"') {
                val += '"'; i++;
            } else if (char === '"') {
                inQuote = !inQuote;
            } else if (char === ',' && !inQuote) {
                ret.push(val); val = '';
            } else {
                val += char;
            }
        }
        ret.push(val);
        return ret;
    }

    async function processFiles() {
        const fileInput = document.getElementById('csvFiles');
        const statusDiv = document.getElementById('status');
        const files = fileInput.files;

        if (files.length === 0) {
            alert("Please select at least one CSV file.");
            return;
        }

        statusDiv.innerText = "Processing " + files.length + " files...";
        let outputText = "";

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const text = await file.text();
            
            // Extract the Kit Name
            let kitName = file.name;
            if (kitName.includes('_YDNA_')) {
                kitName = kitName.split('_YDNA_')[0];
            } else {
                kitName = kitName.split('.')[0]; 
            }

            const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
            if (lines.length < 2) continue; 
            
            const headerLine = parseCSVLine(lines[0]);
            const dataLine = parseCSVLine(lines[1]);
            
            let colMapping = [];
            for (let j = 0; j < headerLine.length; j++) {
                let header = headerLine[j].trim().toLowerCase();
                let normTok = normalizeMarker(header);
                
                if (normTok.includes('kit') || normTok.includes('name') || normTok.includes('haplogroup') || normTok.includes('snp')) {
                    colMapping.push(-1);
                } else {
                    let mapped = -1;
                    const searchA = normTok + 'a';
                    for (let k = 0; k < str_lab.length; k++) {
                        if (normTok === normFallback[k] || searchA === normFallback[k]) {
                            mapped = k;
                            break;
                        }
                    }
                    if (mapped === -1 && normTok.includes("gata-h4")) {
                        mapped = normFallback.indexOf("gatah4");
                    }
                    if (mapped === -1 && normTok.includes("gata-a10")) {
                        mapped = normFallback.indexOf("yga10");
                    }
                    if (mapped === -1 && normTok.includes("ggaat-1b07")) {
                        mapped = normFallback.indexOf("y1b07");
                    }
                    if (mapped === -1 && normTok.includes("ycaii")) {
                        mapped = normFallback.indexOf("ycaiia");
                    }
                    if (mapped === -1 && normTok === "389ii") {
                        mapped = normFallback.indexOf("389ii-i");
                    }
                    colMapping.push(mapped);
                }
            }

            let kitData = new Array(838).fill(0);
            let maxMappedIdx = -1;

            for (let j = 0; j < dataLine.length && j < colMapping.length; j++) {
                let mapped = colMapping[j];
                if (mapped !== -1) {
                    let val = dataLine[j].trim();
                    if (val === "" || val === "-") {
                        // Keep as 0 (N)
                    } else if (val.includes("-")) {
                        let multiIdx = mapped;
                        const subValues = val.split("-");
                        for (let k = 0; k < subValues.length && multiIdx < 838; k++) {
                            const match = subValues[k].trim().match(/\d+/);
                            if (match) {
                                kitData[multiIdx] = parseInt(match[0], 10);
                                if (multiIdx > maxMappedIdx) maxMappedIdx = multiIdx;
                            }
                            multiIdx++;
                        }
                    } else {
                        const match = val.match(/\d+/);
                        if (match) {
                            kitData[mapped] = parseInt(match[0], 10);
                            if (mapped > maxMappedIdx) maxMappedIdx = mapped;
                        }
                    }
                }
            }

            let strValues = [];
            for(let j = 0; j <= maxMappedIdx; j++) {
                if(kitData[j] > 0) {
                    strValues.push(kitData[j]);
                } else {
                    strValues.push("N");
                }
            }

            outputText += kitName + " " + strValues.join(' ') + "\n";
        }

        const blob = new Blob([outputText], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = 'strmerge.txt';
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        statusDiv.innerText = `Successfully merged ${files.length} files!`;
    }
